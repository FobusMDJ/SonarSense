# Render Blueprint: deploys the backend and a PostGIS-enabled Postgres
# database. The Vite frontend is deployed separately on Vercel. In the
# Render dashboard: New -> Blueprint,
# point it at this repo, and it reads this file automatically (must live
# at the repo root, which is why it's here and not under backend/).
#
# The released checkpoints are public GitHub release assets. The container
# downloads them at startup and /health reports their presence and digests.
#
# The database's connection string is wired to the backend automatically
# via fromDatabase below -- no DSN is ever written into this file or into
# config/backend.yaml. Enabling PostGIS on the database itself still
# happens automatically too: src/backend/db_postgis.py's init_db() runs
# `CREATE EXTENSION IF NOT EXISTS postgis` on startup.

databases:
  - name: sonarsense-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: sonarsense-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_BACKEND
        value: postgres
      - key: SONARSENSE_LOW_MEMORY
        value: "1"
      - key: POSTGRES_DSN
        fromDatabase:
          name: sonarsense-db
          property: connectionString
      - key: YOLO_WEIGHTS_URL
        value: https://github.com/FobusMDJ/SonarSense/releases/download/weights-v1/best.pt
      - key: VAE_WEIGHTS_URL
        value: https://github.com/FobusMDJ/SonarSense/releases/download/weights-v1/vae_epoch100.pth
      - key: B2U_WEIGHTS_URL
        value: https://github.com/FobusMDJ/SonarSense/releases/download/weights-v1/B2Ueph2.pth
